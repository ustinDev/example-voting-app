name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLUSTER_NAME: voting-app-cluster

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vote - install deps and syntax check
        run: |
          pip install -r vote/requirements.txt
          python -m py_compile vote/app.py

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Result - install deps and syntax check
        working-directory: result
        run: |
          npm ci
          node --check server.js

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"
      - name: Worker - build
        run: dotnet build worker/Worker.csproj -c Release

      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint voting-app --set db.password=ci-test

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/voting-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (tagged with commit SHA)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy-local:
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to the kind cluster
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl config use-context kind-voting-tf
          helm upgrade --install voting ./voting-app \
            --namespace voting --create-namespace \
            --set global.registry="$DOCKERHUB_USERNAME" \
            --set global.tag="${{ github.sha }}" \
            --set db.password="$DB_PASSWORD" \
            --wait --timeout 5m

  deploy-eks:
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_EKS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: azure/setup-helm@v4

      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Helm deploy
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          helm upgrade --install voting ./voting-app \
            --namespace voting --create-namespace \
            --set global.registry="$DOCKERHUB_USERNAME" \
            --set global.tag="${{ github.sha }}" \
            --set db.password="$DB_PASSWORD" \
            --wait --timeout 5m
